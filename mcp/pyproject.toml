[project]
name = "sg-transport-mcp"
version = "0.1.0"
description = "MCP server for Singapore public transport, traffic and weather (LTA DataMall + data.gov.sg)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
    "gtfs-realtime-bindings>=1.0",
    "protobuf>=4.21",
]

[project.scripts]
sg-transport-mcp = "sg_transport_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_transport_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
